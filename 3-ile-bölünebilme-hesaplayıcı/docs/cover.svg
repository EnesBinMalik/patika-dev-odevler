<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="3 ile bölünebilirlik hesaplayıcı arayüz mockup'ı">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#16324c"/>
    </linearGradient>
    <style>
      .l{font-family:'Segoe UI',Arial,sans-serif;fill:#eaf3fa}
      .m{font-family:'Segoe UI',Arial,sans-serif;fill:#93b4cc}
      .mono{font-family:Consolas,'Courier New',monospace}
      .k{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;fill:#38bdf8}
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bgA)"/>
  <rect x="0" y="0" width="1280" height="42" fill="#081220"/>
  <circle cx="26" cy="21" r="6" fill="#ef4444"/><circle cx="46" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/>
  <rect x="92" y="9" width="330" height="24" rx="12" fill="#16324c"/>
  <text x="108" y="26" class="m" font-size="13">localhost:3000 — 3 ile Bölünebilirlik Hesaplayıcı</text>

  <text x="40" y="96" class="l" font-size="26" font-weight="700">3'e Bölünebilme <tspan class="m" font-size="16" font-weight="400">· sayı → kalan → en yakın kat</tspan></text>
  <rect x="980" y="70" width="130" height="34" rx="8" fill="#164a6b"/><text x="1002" y="92" class="l" font-size="14">Ses: açık</text>
  <rect x="1122" y="70" width="120" height="34" rx="8" fill="#164a6b"/><text x="1146" y="92" class="l" font-size="14">Kod</text>

  <!-- form -->
  <rect x="40" y="130" width="560" height="222" rx="14" fill="#0f2338" stroke="#1e4360"/>
  <text x="64" y="164" class="m" font-size="14">Bir tam sayı girin</text>
  <rect x="64" y="180" width="330" height="52" rx="10" fill="#081220" stroke="#38bdf8"/>
  <text x="88" y="215" class="k" font-size="26">4</text>
  <rect x="410" y="180" width="170" height="52" rx="10" fill="#38bdf8"/>
  <text x="440" y="213" fill="#06192a" font-size="17" class="l" font-weight="700">Hesapla</text>
  <text x="64" y="270" class="l" font-size="16" font-weight="600">Girdiğiniz sayı 3'e bölünemez.</text>
  <text x="64" y="298" class="l" font-size="16">Bölünebilecek ilk sayı <tspan class="k">6'dır</tspan> · öndeki kat <tspan class="k">3</tspan></text>
  <text x="64" y="330" class="m" font-size="14">+2 ekleyerek 6'ya · −1 çıkararak 3'e ulaşılır</text>

  <!-- result detail -->
  <rect x="612" y="130" width="630" height="222" rx="14" fill="#0f2338" stroke="#1e4360"/>
  <text x="636" y="164" class="l" font-size="16" font-weight="600">Adım adım analiz</text>
  <g font-size="14" class="mono">
    <text x="636" y="196" fill="#93b4cc">kalan</text><text x="760" y="196" fill="#fbbf24">((4 % 3) + 3) % 3 = 1</text>
    <text x="636" y="224" fill="#93b4cc">bölüm</text><text x="760" y="224" fill="#eaf3fa">Math.floor(4 / 3) = 1</text>
    <text x="636" y="252" fill="#93b4cc">eklenecek</text><text x="760" y="252" fill="#4ade80">3 − 1 = 2 → 6</text>
    <text x="636" y="280" fill="#93b4cc">çıkarılacak</text><text x="760" y="280" fill="#f87171">1 → 3</text>
    <text x="636" y="308" fill="#93b4cc">rakam toplamı</text><text x="760" y="308" fill="#eaf3fa">4 → 4 (3'ün katı değil)</text>
  </g>
  <rect x="1064" y="188" width="150" height="112" rx="10" fill="#081220" stroke="#1e4360"/>
  <text x="1084" y="214" class="m" font-size="12">bağlaç</text>
  <text x="1084" y="240" class="l" font-size="14">'dır / 'dir</text>
  <text x="1084" y="266" class="l" font-size="14">'dir / 'dür</text>
  <text x="1084" y="290" class="m" font-size="12">turkishGrammar.ts</text>

  <!-- history -->
  <rect x="40" y="364" width="560" height="212" rx="14" fill="#0f2338" stroke="#1e4360"/>
  <text x="64" y="398" class="l" font-size="16" font-weight="600">Geçmiş</text>
  <g font-size="14" class="l">
    <text x="64" y="428">4</text><text x="200" y="428" fill="#f87171">bölünemez → 6</text><text x="470" y="428" class="m">kalan 1</text>
    <text x="64" y="460">15</text><text x="200" y="460" fill="#4ade80">bölünür</text><text x="470" y="460" class="m">kalan 0</text>
    <text x="64" y="492">−9</text><text x="200" y="492" fill="#4ade80">bölünür</text><text x="470" y="492" class="m">kalan 0</text>
    <text x="64" y="524">100</text><text x="200" y="524" fill="#f87171">bölünemez → 102</text><text x="470" y="524" class="m">kalan 1</text>
    <text x="64" y="556" class="m">tekrarsız yığın, state tutulur — localStorage kullanılmaz</text>
  </g>

  <!-- explanation -->
  <rect x="612" y="364" width="630" height="212" rx="14" fill="#0f2338" stroke="#1e4360"/>
  <text x="636" y="398" class="l" font-size="16" font-weight="600">Eğitici açıklama (EducationalBreakdown)</text>
  <text x="636" y="430" class="l" font-size="14">"4 sayısının rakamları toplamı 4 olup 3 ile bölümünden</text>
  <text x="636" y="456" class="l" font-size="14">kalan 1'dir. 3'e tam bölünebilmesi için 2 eklenerek 6 elde edilir."</text>
  <g font-size="13" class="m">
    <text x="636" y="492">girdi doğrulama: boş · ondalık · güvenli tam sayı dışı → hata mesajı</text>
    <text x="636" y="518">başarıda canvas-confetti patlatılır, Web Audio ile ses çalınır</text>
    <text x="636" y="544">kod görüntüleyici: divisibility.ts kaynağı modal içinde</text>
  </g>

  <text x="40" y="608" class="m" font-size="13">Patika.dev · JavaScript patikası · Enes Öztürk — temsilî çizim, canlı ekran görüntüsü değildir.</text>
</svg>
