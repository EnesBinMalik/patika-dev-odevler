<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Clean Blog ödev 11 MVC mimarisi ve update delete arayüz mockup'ı">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#071a14"/><stop offset="100%" stop-color="#123527"/></linearGradient>
    <style>.l{font-family:'Segoe UI',Arial,sans-serif;fill:#e7f6ef}.m{font-family:'Segoe UI',Arial,sans-serif;fill:#93c1ab}.mono{font-family:Consolas,'Courier New',monospace}</style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg11)"/>
  <rect x="0" y="0" width="1280" height="42" fill="#04120c"/>
  <circle cx="26" cy="21" r="6" fill="#ef4444"/><circle cx="46" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/>
  <rect x="92" y="9" width="360" height="24" rx="12" fill="#123527"/><text x="108" y="26" class="m" font-size="13">localhost:3000 — Clean Blog · Ödev 11 (MVC)</text>

  <text x="40" y="96" class="l" font-size="26" font-weight="700">Clean Blog <tspan class="m" font-size="16" font-weight="400">· tam CRUD + MVC mimarisi</tspan></text>

  <!-- MVC three columns -->
  <g>
    <rect x="40" y="130" width="392" height="196" rx="14" fill="#0c241a" stroke="#1d4a35"/>
    <text x="64" y="162" fill="#4ade80" class="l" font-size="16" font-weight="600">Model</text>
    <g font-size="13" class="mono">
      <text x="64" y="192" fill="#93c1ab">models/Post.js · mvcCodeFiles.ts:315</text>
      <text x="64" y="218" fill="#e7f6ef">postSchema = { title, subtitle, detail,</text>
      <text x="104" y="240" fill="#e7f6ef">author, category, imageUrl,</text>
      <text x="104" y="262" fill="#e7f6ef">readTimeMinutes, likes }</text>
      <text x="64" y="294" fill="#93c1ab">İstemci modeli: src/types/index.ts:1-13</text>
    </g>

    <rect x="444" y="130" width="392" height="196" rx="14" fill="#0c241a" stroke="#1d4a35"/>
    <text x="468" y="162" fill="#60a5fa" class="l" font-size="16" font-weight="600">View</text>
    <g font-size="13" class="mono">
      <text x="468" y="192" fill="#93c1ab">views/post.ejs :5 · views/edit.ejs :83</text>
      <text x="468" y="218" fill="#93c1ab">views/partials/_footer.ejs :440</text>
      <text x="468" y="248" fill="#e7f6ef">&lt;form method="POST" action="/posts/&lt;%= id %&gt;?_method=PUT"&gt;</text>
      <text x="468" y="274" fill="#e7f6ef">&lt;input name="_method" value="PUT" hidden&gt;</text>
      <text x="468" y="300" fill="#93c1ab">React karşılığı: EditPostView.tsx</text>
    </g>

    <rect x="848" y="130" width="392" height="196" rx="14" fill="#0c241a" stroke="#1d4a35"/>
    <text x="872" y="162" fill="#fbbf24" class="l" font-size="16" font-weight="600">Controller</text>
    <g font-size="13" class="mono">
      <text x="872" y="192" fill="#93c1ab">controllers/postController.js :175</text>
      <text x="872" y="218" fill="#e7f6ef">getPosts · getPost · createPost</text>
      <text x="872" y="244" fill="#4ade80">updatePost  ← ödevin yeni ayağı</text>
      <text x="872" y="270" fill="#f87171">deletePost  ← onay + toast</text>
      <text x="872" y="300" fill="#93c1ab">pageController.js :269 · app.js :367</text>
    </g>
  </g>

  <!-- CRUD flow -->
  <rect x="40" y="342" width="700" height="214" rx="14" fill="#0c241a" stroke="#1d4a35"/>
  <text x="64" y="374" class="l" font-size="16" font-weight="600">Arayüzde çalışan CRUD (React state + localStorage)</text>
  <g font-size="14" class="mono">
    <text x="64" y="408" fill="#60a5fa">CREATE </text><text x="200" y="408" fill="#e7f6ef">handleAddPost</text><text x="470" y="408" class="m">App.tsx:129</text>
    <text x="64" y="438" fill="#4ade80">UPDATE </text><text x="200" y="438" fill="#e7f6ef">handleSaveUpdatedPost</text><text x="470" y="438" class="m">App.tsx:85</text>
    <text x="64" y="468" fill="#f87171">DELETE </text><text x="200" y="468" fill="#e7f6ef">DeleteConfirmModal + Toast</text><text x="470" y="468" class="m">:106-126</text>
    <text x="64" y="498" fill="#fbbf24">RESET  </text><text x="200" y="498" fill="#e7f6ef">handleResetData</text><text x="470" y="498" class="m">:143</text>
    <text x="64" y="530" fill="#93c1ab">localStorage "clean_blog_odev11_posts" · kategori/beğeni/okuma süresi alanları eklendi</text>
  </g>

  <!-- honest panel -->
  <rect x="756" y="342" width="484" height="214" rx="14" fill="#1b1210" stroke="#7c2d12"/>
  <text x="780" y="374" fill="#fdba74" class="l" font-size="16" font-weight="600">Bunu bilerek oku</text>
  <g font-size="13" class="m">
    <text x="780" y="404" fill="#f87171">✗</text><text x="800" y="404">MVC dosyaları diskte yok; 7 kod parçası string olarak</text>
    <text x="800" y="422">mvcCodeFiles.ts:3-479 içinde gösteriliyor, çalıştırılmıyor</text>
    <text x="780" y="452" fill="#f87171">✗</text><text x="800" y="452">Toast metni "PUT /posts/… postController.updatePost"</text>
    <text x="800" y="470">diyor — sunucu ve HTTP isteği yok (App.tsx:93-97)</text>
    <text x="780" y="500" fill="#f87171">✗</text><text x="800" y="500">imageUrl harici Unsplash adresi (:22) — çevrimdışı kırılır</text>
    <text x="780" y="530" fill="#fbbf24">!</text><text x="800" y="530">App.tsx:61-63 toast timeout'u temizlenmiyor</text>
  </g>

  <text x="40" y="600" class="m" font-size="13">Patika.dev · Node.js patikası Ödev 11 · Enes Öztürk — temsilî çizim, canlı ekran görüntüsü değildir.</text>
</svg>
