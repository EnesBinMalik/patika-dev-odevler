<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Rust Bankacılık Sistemi — Traits ve Structs</title>
  <desc id="desc">Rust trait ve banka hesabı işlemlerini gösteren eğitim paneli illüstrasyonu.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#292013"/></linearGradient><linearGradient id="gold"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#facc15"/></linearGradient></defs>
  <rect width="1280" height="520" rx="28" fill="url(#bg)"/>
  <text x="72" y="88" fill="#fdba74" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">RUST / TRAITS &amp; STRUCTS</text>
  <text x="72" y="166" fill="#fff7ed" font-family="Arial,sans-serif" font-size="48" font-weight="700">Bankacılık Sistemi</text>
  <text x="74" y="218" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="22">Trait Account · BankAccount · Result</text>
  <rect x="72" y="266" width="470" height="2" fill="#475569"/>
  <text x="72" y="322" fill="#94a3b8" font-family="Arial,sans-serif" font-size="18">Metotları uygula, işlemleri ve hataları izle.</text>
  <rect x="630" y="60" width="570" height="394" rx="22" fill="#0f172a" stroke="#374151" stroke-width="2"/>
  <text x="670" y="108" fill="#fbbf24" font-family="monospace" font-size="16">trait Account {</text>
  <text x="700" y="138" fill="#cbd5e1" font-family="monospace" font-size="15">fn deposit(&amp;mut self, amount: f64);</text>
  <text x="700" y="166" fill="#cbd5e1" font-family="monospace" font-size="15">fn withdraw(&amp;mut self, amount: f64)</text>
  <text x="670" y="194" fill="#fbbf24" font-family="monospace" font-size="16">}</text>
  <rect x="670" y="224" width="224" height="172" rx="16" fill="#172033" stroke="#b45309"/>
  <text x="692" y="260" fill="#fdba74" font-family="monospace" font-size="16">TR-1001</text>
  <text x="692" y="301" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Ahmet Yılmaz</text>
  <text x="692" y="354" fill="#86efac" font-family="monospace" font-size="25">₺ 2.250</text>
  <rect x="924" y="224" width="238" height="172" rx="16" fill="#172033" stroke="#374151"/>
  <text x="948" y="260" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">SONUÇ</text>
  <circle cx="960" cy="306" r="10" fill="#34d399"/>
  <text x="984" y="312" fill="#a7f3d0" font-family="monospace" font-size="17">Ok(())</text>
  <text x="948" y="353" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Bakiye güvenli biçimde güncellendi</text>
</svg>
