<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Clean Blog ödev 9 Mongoose ve MongoDB API arayüz mockup'ı">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0c1224"/><stop offset="100%" stop-color="#1a2340"/></linearGradient>
    <style>.l{font-family:'Segoe UI',Arial,sans-serif;fill:#e8ecfb}.m{font-family:'Segoe UI',Arial,sans-serif;fill:#9aa6d0}.mono{font-family:Consolas,'Courier New',monospace}</style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg9)"/>
  <rect x="0" y="0" width="1280" height="42" fill="#070b18"/>
  <circle cx="26" cy="21" r="6" fill="#ef4444"/><circle cx="46" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/>
  <rect x="92" y="9" width="330" height="24" rx="12" fill="#1a2340"/><text x="108" y="26" class="m" font-size="13">localhost:3000 — Clean Blog · Ödev 9 (MongoDB)</text>

  <text x="40" y="96" class="l" font-size="26" font-weight="700">Clean Blog <tspan class="m" font-size="16" font-weight="400">· ilk veritabanı ve ilk REST API</tspan></text>
  <rect x="980" y="70" width="260" height="30" rx="15" fill="#1f2a4d"/>
  <text x="1000" y="90" class="m" font-size="12">Database · cleanblog-test-db</text>

  <!-- schema card -->
  <rect x="40" y="130" width="420" height="240" rx="14" fill="#111a34" stroke="#26325c"/>
  <text x="64" y="162" class="l" font-size="16" font-weight="600">src/models/Post.ts</text>
  <g font-size="14" class="mono">
    <text x="64" y="192" fill="#a5b4fc">const PostSchema = new Schema({</text>
    <text x="88" y="218" fill="#e8ecfb">title:      { type: String, required: true },</text>
    <text x="88" y="242" fill="#e8ecfb">detail:     { type: String, required: true },</text>
    <text x="88" y="266" fill="#e8ecfb">author:     { type: String, required: true },</text>
    <text x="88" y="290" fill="#e8ecfb">dateCreated: { type: Date, default: Date.now }</text>
    <text x="64" y="316" fill="#a5b4fc">});</text>
    <text x="64" y="346" fill="#9aa6d0">// :16-35 · IPostDocument :9-14</text>
  </g>

  <!-- endpoints -->
  <rect x="476" y="130" width="392" height="240" rx="14" fill="#111a34" stroke="#26325c"/>
  <text x="500" y="162" class="l" font-size="16" font-weight="600">/api/posts</text>
  <g font-size="14" class="mono">
    <text x="500" y="194" fill="#4ade80">GET    </text><text x="580" y="194" fill="#e8ecfb">/api/posts</text><text x="700" y="194" class="m">liste (:106)</text>
    <text x="500" y="222" fill="#4ade80">GET    </text><text x="580" y="222" fill="#e8ecfb">/api/posts/:id</text><text x="700" y="222" class="m">tekil (:124)</text>
    <text x="500" y="250" fill="#60a5fa">POST   </text><text x="580" y="250" fill="#e8ecfb">/api/posts</text><text x="700" y="250" class="m">req.body (:142)</text>
    <text x="500" y="278" fill="#f87171">DELETE </text><text x="580" y="278" fill="#e8ecfb">/api/posts/:id</text><text x="700" y="278" class="m">(:180)</text>
    <text x="500" y="306" fill="#60a5fa">POST   </text><text x="580" y="306" fill="#e8ecfb">/api/posts/reset</text><text x="700" y="306" class="m">tohumlama (:194)</text>
    <text x="500" y="336" fill="#fbbf24">PUT    </text><text x="580" y="336" fill="#9aa6d0">yok — güncelleme bu ödevde yok</text>
  </g>

  <!-- connection -->
  <rect x="884" y="130" width="358" height="240" rx="14" fill="#111a34" stroke="#26325c"/>
  <text x="908" y="162" class="l" font-size="16" font-weight="600">Bağlantı gerçeği</text>
  <g font-size="13" class="mono">
    <text x="908" y="192" fill="#a5b4fc">mongoose.connect(MONGODB_URI, {</text>
    <text x="908" y="216" fill="#e8ecfb">  serverSelectionTimeoutMS: 2500</text>
    <text x="908" y="240" fill="#a5b4fc">})</text>
    <text x="908" y="272" fill="#9aa6d0">default: mongodb://localhost:27017/</text>
    <text x="908" y="294" fill="#9aa6d0">          cleanblog-test-db</text>
  </g>
  <rect x="908" y="308" width="310" height="42" rx="8" fill="#2a1616" stroke="#7f1d1d"/>
  <text x="922" y="326" font-size="12" fill="#fca5a5" class="mono">fail → sessizce inMemoryPosts'e düşer (:73)</text>
  <text x="922" y="344" font-size="12" fill="#fca5a5" class="mono">Navbar "Mongoose Modeli Aktif" sabit yazılır</text>

  <!-- flow strip -->
  <rect x="40" y="386" width="1202" height="176" rx="14" fill="#111a34" stroke="#26325c"/>
  <text x="64" y="418" class="l" font-size="16" font-weight="600">İstek akışı ve ödevin odak noktası</text>
  <g font-size="14" class="mono">
    <text x="64" y="452" fill="#4ade80">Tarayıcı</text><text x="160" y="452" fill="#9aa6d0">src/services/api.ts</text><text x="360" y="452" fill="#e8ecfb">→ fetch POST /api/posts</text><text x="640" y="452" fill="#e8ecfb">→ server.ts</text><text x="820" y="452" fill="#a5b4fc">→ MongoDB · Post.create()</text>
    <text x="64" y="482" fill="#fbbf24">ders</text><text x="160" y="482" fill="#e8ecfb">express.urlencoded({ extended: true }) (:101) — req.body okuma</text>
    <text x="64" y="512" fill="#fbbf24">yedek</text><text x="160" y="512" fill="#e8ecfb">api.ts aynı veriyi localStorage'a da yazar (:3-51) — çevrimdışı deneme için</text>
    <text x="64" y="542" fill="#f87171">uyarı</text><text x="160" y="542" fill="#e8ecfb">MongoDB yoksa ödev "geçer" ama veritabanı kullanılmamış olur; /api/status (:215) bunu "Simüle DB Aktif" diye etiketler</text>
  </g>

  <text x="40" y="600" class="m" font-size="13">Patika.dev · Node.js &amp; MongoDB patikası Ödev 9 · Enes Öztürk — temsilî çizim, canlı ekran görüntüsü değildir.</text>
</svg>
