<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">BookStore WebApi — Birim Test Laboratuvarı</title>
  <desc id="desc">Book, Genre ve Author alanları için test senaryolarını ve Arrange, Act, Assert akışını tanıtan proje kapağı.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020" />
      <stop offset="1" stop-color="#171b3b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".08" />
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>
  <rect width="1280" height="520" rx="28" fill="url(#bg)" />
  <rect width="1280" height="520" rx="28" fill="url(#grid)" />
  <circle cx="1090" cy="100" r="120" fill="#6366f1" opacity=".15" filter="url(#glow)" />
  <circle cx="1100" cy="400" r="130" fill="#06b6d4" opacity=".12" filter="url(#glow)" />
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="76" y="70" width="218" height="38" rx="19" fill="#312e81" fill-opacity=".6" stroke="#818cf8" stroke-opacity=".55" />
    <circle cx="98" cy="89" r="5" fill="#34d399" />
    <text x="113" y="95" fill="#c7d2fe" font-size="14" font-weight="700" letter-spacing="1.6">PATİKA.DEV · EĞİTİM PROJESİ</text>
    <text x="76" y="180" fill="#f8fafc" font-size="47" font-weight="800">BookStore WebApi</text>
    <text x="76" y="238" fill="url(#accent)" font-size="36" font-weight="800">Birim Test Laboratuvarı</text>
    <text x="78" y="285" fill="#cbd5e1" font-size="18">Senaryoları keşfet · AAA akışını incele · doğrulama kurallarını öğren</text>
    <g transform="translate(78 330)">
      <rect width="116" height="40" rx="20" fill="#1e293b" stroke="#475569" />
      <text x="58" y="26" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">BOOK</text>
      <rect x="128" width="116" height="40" rx="20" fill="#1e293b" stroke="#475569" />
      <text x="186" y="26" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">GENRE</text>
      <rect x="256" width="116" height="40" rx="20" fill="#1e293b" stroke="#475569" />
      <text x="314" y="26" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">AUTHOR</text>
    </g>
    <text x="78" y="432" fill="#94a3b8" font-size="15">xUnit yaklaşımı · FluentAssertions · TypeScript + React</text>
    <text x="78" y="474" fill="#64748b" font-size="13">Eğitim amaçlı arayüz — sonuçlar tarayıcıda simüle edilir.</text>
  </g>
  <g transform="translate(810 125)" font-family="monospace">
    <rect width="392" height="282" rx="18" fill="#090e1b" stroke="#334155" stroke-width="1.5" />
    <path d="M0 48H392" stroke="#334155" />
    <circle cx="25" cy="24" r="5" fill="#fb7185" />
    <circle cx="44" cy="24" r="5" fill="#fbbf24" />
    <circle cx="63" cy="24" r="5" fill="#34d399" />
    <text x="90" y="29" fill="#94a3b8" font-size="12">TestScenario.cs</text>
    <text x="28" y="91" fill="#a5b4fc" font-size="14">// Arrange — Act — Assert</text>
    <text x="28" y="132" fill="#c4b5fd" font-size="14">[Fact]</text>
    <text x="28" y="159" fill="#e2e8f0" font-size="14">public void Should_be_valid()</text>
    <text x="42" y="194" fill="#67e8f9" font-size="14">var result = validator</text>
    <text x="42" y="218" fill="#67e8f9" font-size="14">    .Validate(command);</text>
    <rect x="27" y="238" width="190" height="26" rx="7" fill="#064e3b" fill-opacity=".5" />
    <text x="40" y="256" fill="#6ee7b7" font-size="12">✓ ÖRNEK SENARYO</text>
  </g>
  <text x="1198" y="480" text-anchor="end" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Enes Öztürk</text>
</svg>
