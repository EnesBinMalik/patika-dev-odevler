<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Rust Sahiplik ve Referanslar Laboratuvarı</title>
  <desc id="desc">String sahipliği, ödünç alma ve stack-heap belleğini anlatan eğitim illüstrasyonu.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1324"/><stop offset="1" stop-color="#292039"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
  </defs>
  <rect width="1280" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="220" fill="#f59e0b" opacity=".06"/>
  <text x="72" y="88" fill="#fbbf24" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">RUST / OWNERSHIP</text>
  <text x="72" y="166" fill="#f8fafc" font-family="Arial,sans-serif" font-size="50" font-weight="700">Sahiplik ve</text>
  <text x="72" y="226" fill="#f8fafc" font-family="Arial,sans-serif" font-size="50" font-weight="700">Ödünç Alma</text>
  <text x="74" y="276" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="22">String · &amp;str · Borrow Checker</text>
  <rect x="72" y="330" width="510" height="2" fill="#475569"/>
  <text x="72" y="378" fill="#94a3b8" font-family="Arial,sans-serif" font-size="18">Kodla dene, bellekteki değişimi adım adım izle.</text>
  <rect x="665" y="66" width="540" height="388" rx="22" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="665" y="66" width="540" height="48" rx="22" fill="#172033"/>
  <circle cx="697" cy="90" r="6" fill="#fb7185"/><circle cx="719" cy="90" r="6" fill="#fbbf24"/><circle cx="741" cy="90" r="6" fill="#34d399"/>
  <text x="780" y="97" fill="#94a3b8" font-family="monospace" font-size="15">src/main.rs</text>
  <text x="704" y="160" fill="#c4b5fd" font-family="monospace" font-size="18">let</text>
  <text x="748" y="160" fill="#e2e8f0" font-family="monospace" font-size="18">message = String::from(</text>
  <text x="704" y="192" fill="#86efac" font-family="monospace" font-size="18">"Merhaba Rust"</text>
  <text x="856" y="192" fill="#e2e8f0" font-family="monospace" font-size="18">);</text>
  <rect x="704" y="224" width="205" height="70" rx="12" fill="#1e293b" stroke="#f59e0b"/>
  <text x="727" y="251" fill="#fbbf24" font-family="monospace" font-size="15">STACK</text>
  <text x="727" y="276" fill="#e2e8f0" font-family="monospace" font-size="16">message → heap</text>
  <path d="M922 259h72" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="m985 249 14 10-14 10" fill="none" stroke="#fb7185" stroke-width="4"/>
  <rect x="1010" y="224" width="155" height="70" rx="12" fill="#1e293b" stroke="#fb7185"/>
  <text x="1032" y="251" fill="#fb7185" font-family="monospace" font-size="15">HEAP</text>
  <text x="1032" y="276" fill="#e2e8f0" font-family="monospace" font-size="16">"Merhaba"</text>
  <rect x="704" y="328" width="460" height="78" rx="12" fill="#111827" stroke="#334155"/>
  <circle cx="729" cy="366" r="8" fill="#34d399"/>
  <text x="751" y="372" fill="#a7f3d0" font-family="monospace" font-size="16">borrow(&amp;message) → değer korunur</text>
</svg>
