<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Rust Özel Filtreleme Laboratuvarı</title>
  <desc id="desc">FilterCondition ile koleksiyondaki eşleşen değerleri seçen eğitim illüstrasyonu.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10121b"/><stop offset="1" stop-color="#292116"/></linearGradient><linearGradient id="a"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#facc15"/></linearGradient></defs>
  <rect width="1280" height="520" rx="28" fill="url(#bg)"/>
  <text x="72" y="88" fill="#fdba74" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">RUST / COLLECTIONS</text>
  <text x="72" y="170" fill="#fff7ed" font-family="Arial,sans-serif" font-size="48" font-weight="700">Özel Filtreleme</text>
  <text x="74" y="222" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="22">Closure olmadan · Vec&lt;T&gt; · Rust 2021</text>
  <rect x="72" y="270" width="470" height="2" fill="#475569"/>
  <text x="72" y="326" fill="#94a3b8" font-family="Arial,sans-serif" font-size="18">Koşulu tanımla, her elemanın kararını izle.</text>
  <rect x="630" y="62" width="574" height="390" rx="22" fill="#111827" stroke="#3f3f46" stroke-width="2"/>
  <text x="670" y="112" fill="#a1a1aa" font-family="monospace" font-size="15">let values = vec![10, 25, 42, 25, 88];</text>
  <text x="670" y="160" fill="#fdba74" font-family="monospace" font-size="17">FilterCondition { desired_value: 25 }</text>
  <g font-family="monospace" font-size="18" font-weight="700">
    <rect x="670" y="198" width="78" height="54" rx="12" fill="#27272a"/><text x="696" y="232" fill="#d4d4d8">10</text>
    <rect x="766" y="198" width="78" height="54" rx="12" fill="#431407" stroke="#fb923c"/><text x="792" y="232" fill="#fdba74">25</text>
    <rect x="862" y="198" width="78" height="54" rx="12" fill="#27272a"/><text x="888" y="232" fill="#d4d4d8">42</text>
    <rect x="958" y="198" width="78" height="54" rx="12" fill="#431407" stroke="#fb923c"/><text x="984" y="232" fill="#fdba74">25</text>
    <rect x="1054" y="198" width="78" height="54" rx="12" fill="#27272a"/><text x="1080" y="232" fill="#d4d4d8">88</text>
  </g>
  <path d="M804 264v42m0 0-12-12m12 12 12-12M996 264v42m0 0-12-12m12 12 12-12" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="748" y="326" width="318" height="72" rx="16" fill="#1c1917" stroke="#9a3412"/>
  <text x="780" y="356" fill="#a8a29e" font-family="monospace" font-size="14">custom_filter(...)</text>
  <text x="780" y="383" fill="#fdba74" font-family="monospace" font-size="19" font-weight="700">[25, 25]  →  2 eşleşme</text>
</svg>
