<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Anonim sohbet GraphQL ve Redis pubsub arayüz mockup'ı">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120c22"/><stop offset="100%" stop-color="#20143c"/>
    </linearGradient>
    <style>
      .l{font-family:'Segoe UI',Arial,sans-serif;fill:#efe9ff}
      .m{font-family:'Segoe UI',Arial,sans-serif;fill:#a296c9}
      .mono{font-family:Consolas,'Courier New',monospace}
      .nav{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;fill:#cbbfe8}
      .navOn{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;fill:#e535ab;font-weight:600}
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bgB)"/>
  <rect x="0" y="0" width="1280" height="42" fill="#0b0718"/>
  <circle cx="26" cy="21" r="6" fill="#ef4444"/><circle cx="46" cy="21" r="6" fill="#f59e0b"/><circle cx="66" cy="21" r="6" fill="#22c55e"/>
  <rect x="92" y="9" width="340" height="24" rx="12" fill="#20143c"/>
  <text x="108" y="26" class="m" font-size="13">localhost:3000 — Anonymous Chat · GraphQL + Redis PubSub</text>

  <rect x="0" y="42" width="1280" height="52" fill="#191033"/>
  <rect x="34" y="56" width="22" height="22" rx="11" fill="#e535ab"/>
  <text x="66" y="74" class="l" font-size="18" font-weight="700">anon<tspan fill="#e535ab">chat</tspan></text>
  <text x="420" y="74" class="navOn">Sohbet</text>
  <text x="500" y="74" class="nav">GraphQL Denetçisi</text>
  <text x="650" y="74" class="nav">Profil</text>
  <rect x="980" y="55" width="266" height="26" rx="13" fill="#241a44"/>
  <text x="996" y="73" class="m" font-size="12">ws://localhost:3000/graphql · subscribe</text>

  <!-- rooms sidebar -->
  <rect x="34" y="112" width="236" height="464" rx="14" fill="#150e2c" stroke="#2b1f4d"/>
  <text x="54" y="142" class="l" font-size="15" font-weight="600">Odalar</text>
  <g font-size="14" class="l">
    <rect x="54" y="156" width="196" height="46" rx="10" fill="#2b1f4d"/><text x="70" y="176"># genel</text><text x="70" y="194" class="m" font-size="12">12 mesaj</text>
    <rect x="54" y="210" width="196" height="46" rx="10" fill="#1d1439"/><text x="70" y="230"># teknoloji</text><text x="70" y="248" class="m" font-size="12">7 mesaj</text>
    <rect x="54" y="264" width="196" height="46" rx="10" fill="#1d1439"/><text x="70" y="284"># odaklanma</text><text x="70" y="302" class="m" font-size="12">3 mesaj</text>
    <rect x="54" y="322" width="196" height="38" rx="10" fill="#e535ab"/><text x="82" y="346" fill="#ffffff" class="l">+ Oda aç</text>
  </g>
  <rect x="54" y="400" width="196" height="150" rx="10" fill="#0f0a20" stroke="#2b1f4d"/>
  <text x="70" y="426" class="m" font-size="12">query { stats { … } }</text>
  <g font-size="12" class="mono">
    <text x="70" y="452" fill="#a3e635">totalMessages</text><text x="212" y="452" fill="#efe9ff">22</text>
    <text x="70" y="476" fill="#a3e635">activeRooms</text><text x="212" y="476" fill="#efe9ff">3</text>
    <text x="70" y="500" fill="#fbbf24">redisStatus</text><text x="212" y="500" fill="#fbbf24">mock</text>
    <text x="70" y="528" fill="#a296c9">uptimeSeconds</text>
  </g>

  <!-- messages -->
  <rect x="286" y="112" width="620" height="464" rx="14" fill="#150e2c" stroke="#2b1f4d"/>
  <text x="310" y="142" class="l" font-size="15" font-weight="600"># genel</text>
  <text x="310" y="166" class="m" font-size="12">abonelik: subscription { messageAdded(roomId: "genel") { id content author } }</text>

  <g class="l" font-size="14">
    <circle cx="326" cy="204" r="16" fill="#38bdf8"/><text x="316" y="209" font-size="12">🦊</text>
    <text x="356" y="196" class="m" font-size="12">Anonim Tilki · 21:04</text>
    <rect x="356" y="204" width="330" height="38" rx="10" fill="#221740"/><text x="372" y="228">Redis yoksa ioredis-mock devreye giriyor</text>
    <text x="700" y="228" class="m" font-size="12">♥ 4</text>

    <circle cx="326" cy="286" r="16" fill="#a78bfa"/><text x="316" y="291" font-size="12">🐙</text>
    <text x="356" y="278" class="m" font-size="12">Anonim Ahtapot · 21:06</text>
    <rect x="356" y="286" width="380" height="38" rx="10" fill="#221740"/><text x="372" y="310">sendMessage mutation'ı publish tetikliyor</text>
    <text x="750" y="310" class="m" font-size="12">♥ 7</text>

    <rect x="356" y="334" width="330" height="52" rx="10" fill="#1a1230" stroke="#2b1f4d"/>
    <text x="372" y="356" class="m" font-size="12">yanıt → Anonim Tilki</text><text x="372" y="376" class="l" font-size="13">"diğer sekmeler de abone mi?"</text>

    <circle cx="326" cy="426" r="16" fill="#34d399"/><text x="316" y="431" font-size="12">🦉</text>
    <text x="356" y="418" class="m" font-size="12">Anonim Baykuş · yazıyor…</text>
    <rect x="356" y="426" width="150" height="30" rx="15" fill="#221740"/>
    <circle cx="384" cy="441" r="4" fill="#a296c9"/><circle cx="400" cy="441" r="4" fill="#a296c9"/><circle cx="416" cy="441" r="4" fill="#a296c9"/>
    <text x="530" y="446" class="m" font-size="12">userTyping aboneliği · setTyping mutation</text>
  </g>

  <rect x="310" y="500" width="572" height="52" rx="12" fill="#0f0a20" stroke="#2b1f4d"/>
  <text x="330" y="531" class="m" font-size="14">mesaj yaz… (anonim kimlik: rastgele hayvan + renk)</text>
  <rect x="792" y="510" width="80" height="32" rx="8" fill="#e535ab"/><text x="812" y="531" class="l" font-size="14">Gönder</text>

  <!-- inspector -->
  <rect x="922" y="112" width="324" height="464" rx="14" fill="#150e2c" stroke="#e535ab"/>
  <text x="946" y="142" class="l" font-size="15" font-weight="600">GraphQL Denetçisi</text>
  <g font-size="12" class="mono">
    <text x="946" y="174" fill="#a296c9"># Mutation</text>
    <text x="946" y="194" fill="#7ee0a3">sendMessage(content, author, roomId, replyToId)</text>
    <text x="946" y="214" fill="#7ee0a3">likeMessage(id) · setTyping(roomId, author, isTyping)</text>
    <text x="946" y="234" fill="#7ee0a3">createRoom(id, name, description) · clearRoomMessages</text>
    <text x="946" y="266" fill="#a296c9"># Subscription</text>
    <text x="946" y="286" fill="#61dafb">messageAdded(roomId)</text>
    <text x="946" y="306" fill="#61dafb">messageLiked(roomId)</text>
    <text x="946" y="326" fill="#61dafb">userTyping(roomId)</text>
    <text x="946" y="358" fill="#a296c9"># Transport</text>
    <text x="946" y="378" fill="#e8e3f7">sorgu/mutasyon → POST /graphql (fetch)</text>
    <text x="946" y="398" fill="#e8e3f7">abonelik → graphql-ws (use/ws, 3000)</text>
    <text x="946" y="418" fill="#e8e3f7">yayıncı → RedisPubSub (graphql-redis-subscriptions)</text>
  </g>
  <rect x="946" y="440" width="272" height="60" rx="10" fill="#2a1622" stroke="#7c2d4a"/>
  <text x="962" y="464" font-size="12" class="mono" fill="#f87171">Depo: bellek içi dizi (max 500 mesaj)</text>
  <text x="962" y="486" font-size="12" class="mono" fill="#fbbf24">sunucu yeniden başlarsa sohbet sıfırlanır</text>
  <rect x="946" y="512" width="272" height="42" rx="10" fill="#0f0a20" stroke="#2b1f4d"/>
  <text x="962" y="538" font-size="12" class="m">REDIS_URL verilmezse mock modda çalışır</text>

  <text x="34" y="608" class="m" font-size="13">Patika.dev · GraphQL patikası · Enes Öztürk — temsilî çizim, canlı ekran görüntüsü değildir.</text>
</svg>
